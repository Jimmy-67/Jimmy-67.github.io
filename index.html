createBox(`

<input id="calculatorInput" placeholder="2+2">
<button onclick="calculateNumber()">=</button>
<button onclick="clearCalculator()">wissen</button>
<div class="output" id="calculatorOutput">0</div>
`);

function calculateNumber(){

    const input=
        document.getElementById("calculatorInput").value.trim();

    const output=
        document.getElementById("calculatorOutput");

    if(input===""){
        output.textContent="0";
        return;
    }

    if(!/^[0-9+\\-*\\/(). %]+$/.test(input)){
        output.textContent="fout";
        return;
    }

    try{

        const result=Function(
            '"use strict";return ('+input+')'
        )();

        if(!Number.isFinite(result)){
            output.textContent="fout";
        }else{
            output.textContent=result;
        }

    }catch(error){
        output.textContent="fout";
    }
}

function clearCalculator(){
    document.getElementById("calculatorInput").value="";
    document.getElementById("calculatorOutput").textContent="0";
}

createBox(`
<h2>Snake</h2>

<div class="gameArea">
<canvas id="snakeCanvas" width="240" height="180"></canvas>
</div>

<button onclick="startSnakeGame()">start</button>

<div class="output">
score: <span id="snakeScore">0</span>
</div>
`);

const snakeCanvas=
    document.getElementById("snakeCanvas");

const snakeContext=
    snakeCanvas.getContext("2d");

let snakeBody=[];
let snakeDirection={x:1,y:0};
let snakeFood={x:5,y:5};
let snakeInterval=null;
let snakePoints=0;

function startSnakeGame(){

    clearInterval(snakeInterval);

    snakeBody=[
        {x:5,y:5},
        {x:4,y:5},
        {x:3,y:5}
    ];

    snakeDirection={x:1,y:0};
    snakePoints=0;

    document.getElementById("snakeScore").textContent="0";

    placeSnakeFood();

    snakeInterval=setInterval(updateSnakeGame,120);
}

function placeSnakeFood(){

    do{
        snakeFood={
            x:Math.floor(Math.random()*12),
            y:Math.floor(Math.random()*9)
        };
    }while(
        snakeBody.some(
            part=>
            part.x===snakeFood.x &&
            part.y===snakeFood.y
        )
    );
}

function updateSnakeGame(){

    const head={
        x:snakeBody[0].x+snakeDirection.x,
        y:snakeBody[0].y+snakeDirection.y
    };

    if(
        head.x<0 ||
        head.y<0 ||
        head.x>=12 ||
        head.y>=9 ||
        snakeBody.some(
            part=>
            part.x===head.x &&
            part.y===head.y
        )
    ){

        clearInterval(snakeInterval);
        return;
    }

    snakeBody.unshift(head);

    if(
        head.x===snakeFood.x &&
        head.y===snakeFood.y
    ){

        snakePoints++;

        document.getElementById(
            "snakeScore"
        ).textContent=snakePoints;

        placeSnakeFood();

    }else{
        snakeBody.pop();
    }

    snakeContext.clearRect(
        0,
        0,
        snakeCanvas.width,
        snakeCanvas.height
    );

    snakeContext.fillStyle="red";

    snakeContext.fillRect(
        snakeFood.x*20,
        snakeFood.y*20,
        18,
        18
    );

    snakeContext.fillStyle="lime";

    snakeBody.forEach(part=>{
        snakeContext.fillRect(
            part.x*20,
            part.y*20,
            18,
            18
        );
    });
}

document.addEventListener("keydown",function(event){

    if(event.key==="ArrowUp" && snakeDirection.y!==1){
        snakeDirection={x:0,y:-1};
    }

    if(event.key==="ArrowDown" && snakeDirection.y!==-1){
        snakeDirection={x:0,y:1};
    }

    if(event.key==="ArrowLeft" && snakeDirection.x!==1){
        snakeDirection={x:-1,y:0};
    }

    if(event.key==="ArrowRight" && snakeDirection.x!==-1){
        snakeDirection={x:1,y:0};
    }
});

createBox(`

<button onclick="clearDrawing()">weg</button>
`);

const paintCanvas=
    document.getElementById("paintCanvas");

const paintContext=
    paintCanvas.getContext("2d");

let painting=false;

paintCanvas.addEventListener(
    "pointerdown",
    function(e){
        painting=true;
        drawOnCanvas(e);
    }
);

paintCanvas.addEventListener(
    "pointerup",
    function(){
        painting=false;
    }
);

paintCanvas.addEventListener(
    "pointerleave",
    function(){
        painting=false;
    }
);

paintCanvas.addEventListener(
    "pointermove",
    drawOnCanvas
);

function drawOnCanvas(event){

    if(!painting)return;

    const rect=
        paintCanvas.getBoundingClientRect();

    paintContext.fillStyle=randomItem([
        "red",
        "blue",
        "lime",
        "yellow",
        "purple",
        "black",
        "orange"
    ]);

    paintContext.fillRect(
        event.clientX-rect.left,
        event.clientY-rect.top,
        8,
        8
    );
}

function clearDrawing(){

    paintContext.clearRect(
        0,
        0,
        paintCanvas.width,
        paintCanvas.height
    );
}

createBox(`
<h2>memory</h2>
<div id="memoryGrid"></div>
<div class="output" id="memoryStatus">0 paren</div>
<button onclick="startMemory()">nieuw</button>
`);

let memoryCards=[];
let memoryOpen=[];
let memoryLocked=false;
let memoryPairs=0;

function startMemory(){

    const values=[
        "🐔","🐔",
        "🧀","🧀",
        "🍌","🍌",
        "🦆","🦆",
        "🤨","🤨",
        "🚽","🚽",
        "⭐","⭐",
        "💀","💀"
    ];

    values.sort(()=>Math.random()-.5);

    const grid=
        document.getElementById("memoryGrid");

    grid.innerHTML="";

    memoryCards=[];
    memoryOpen=[];
    memoryLocked=false;
    memoryPairs=0;

    document.getElementById(
        "memoryStatus"
    ).textContent="0 paren";

    values.forEach((value,index)=>{

        const button=
            document.createElement("button");

        button.className="memoryCard";
        button.textContent="?";

        button.onclick=function(){
            memoryClick(button,value,index);
        };

        grid.appendChild(button);

        memoryCards.push({
            button,
            value,
            matched:false
        });
    });
}

function memoryClick(button,value,index){

    if(memoryLocked)return;
    if(memoryCards[index].matched)return;
    if(memoryOpen.some(x=>x.index===index))return;

    button.textContent=value;

    memoryOpen.push({
        button,
        value,
        index
    });

    if(memoryOpen.length<2)return;

    memoryLocked=true;

    const first=memoryOpen[0];
    const second=memoryOpen[1];

    if(first.value===second.value){

        memoryCards[first.index].matched=true;
        memoryCards[second.index].matched=true;

        memoryPairs++;

        document.getElementById(
            "memoryStatus"
        ).textContent=
            memoryPairs+" paren";

        memoryOpen=[];
        memoryLocked=false;

    }else{

        setTimeout(function(){

            first.button.textContent="?";
            second.button.textContent="?";

            memoryOpen=[];
            memoryLocked=false;

        },600);
    }
}

startMemory();

createBox(`
<h2>reactie</h2>
<button id="reactionButton" onclick="reactionClick()">
klik om te beginnen
</button>
<div class="output" id="reactionResult">---</div>
`);

let reactionStart=0;
let reactionTimeout=null;
let reactionWaiting=false;

function startReactionGame(){

    const button=
        document.getElementById("reactionButton");

    button.className="waiting";
    button.textContent="WACHT...";

    reactionWaiting=true;

    reactionTimeout=setTimeout(function(){

        button.className="ready";
        button.textContent="NU!!!";

        reactionStart=performance.now();
        reactionWaiting=false;

    },1000+Math.random()*3000);
}

function reactionClick(){

    const button=
        document.getElementById("reactionButton");

    const result=
        document.getElementById("reactionResult");

    if(!reactionStart && !reactionWaiting){

        startReactionGame();
        return;
    }

    if(reactionWaiting){

        clearTimeout(reactionTimeout);

        reactionWaiting=false;
        reactionStart=0;

        button.className="";
        button.textContent="te vroeg";

        result.textContent="te vroeg";

        setTimeout(startReactionGame,1000);

        return;
    }

    const time=
        Math.round(performance.now()-reactionStart);

    result.textContent=time+" ms";

    reactionStart=0;

    button.className="";
    button.textContent="nog een keer";

    setTimeout(startReactionGame,1000);
}

let audioContext=null;

function makeBeep(frequency){

    if(!audioContext){

        audioContext=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioContext.state==="suspended"){
        audioContext.resume();
    }

    const oscillator=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    oscillator.frequency.value=frequency;
    gain.gain.value=.05;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime+.15
    );
}
