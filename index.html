```html
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Space Shooter</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #050014;
        font-family: Arial, sans-serif;
        color: white;
    }

    canvas {
        display: block;
        background:
            radial-gradient(circle at center, #180044 0%, #050014 70%);
    }

    #hud {
        position: fixed;
        top: 15px;
        left: 20px;
        z-index: 5;
        font-size: 20px;
        text-shadow: 0 0 10px #00ffff;
        user-select: none;
    }

    #startScreen,
    #gameOver {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(3, 0, 15, 0.85);
        z-index: 10;
        text-align: center;
    }

    h1 {
        font-size: 60px;
        margin: 0 0 10px;
        color: #00ffff;
        text-shadow:
            0 0 10px #00ffff,
            0 0 30px #0077ff,
            0 0 60px #ff00ff;
    }

    h2 {
        font-size: 42px;
        color: #ff00ff;
        text-shadow: 0 0 20px #ff00ff;
    }

    p {
        font-size: 18px;
        color: #ccc;
    }

    button {
        margin-top: 20px;
        padding: 15px 40px;
        border: 2px solid #00ffff;
        border-radius: 10px;
        background: transparent;
        color: #00ffff;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 15px #00ffff;
        transition: 0.2s;
    }

    button:hover {
        background: #00ffff;
        color: #050014;
        transform: scale(1.08);
        box-shadow:
            0 0 20px #00ffff,
            0 0 50px #00ffff;
    }

    #mobileControls {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        display: none;
        justify-content: center;
        gap: 15px;
        z-index: 6;
    }

    .control {
        width: 65px;
        height: 65px;
        border: 2px solid #00ffff;
        border-radius: 50%;
        background: rgba(0,255,255,0.1);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 25px;
        user-select: none;
    }

    @media (max-width: 700px) {
        h1 {
            font-size: 40px;
        }

        #mobileControls {
            display: flex;
        }
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    🚀 Score: <span id="score">0</span>
    &nbsp;&nbsp;
    ❤️ HP: <span id="hp">3</span>
    &nbsp;&nbsp;
    ⭐ Level: <span id="level">1</span>
</div>

<div id="startScreen">
    <h1>NEON SPACE</h1>
    <p>⚡ Destroy the enemies and survive as long as possible!</p>
    <p>WASD / Pijltjestoetsen = bewegen &nbsp; | &nbsp; Spatie = schieten</p>
    <button onclick="startGame()">START GAME</button>
</div>

<div id="gameOver" style="display:none;">
    <h2>GAME OVER</h2>
    <p>Je score: <strong id="finalScore">0</strong></p>
    <button onclick="startGame()">OPNIEUW</button>
</div>

<div id="mobileControls">
    <div class="control" id="left">◀</div>
    <div class="control" id="shoot">🔥</div>
    <div class="control" id="right">▶</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

let player;
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

let score = 0;
let hp = 3;
let level = 1;
let running = false;

let keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        keys.space = true;
        e.preventDefault();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;

    if (e.code === "Space") {
        keys.space = false;
    }
});

for (let i = 0; i < 150; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: Math.random() * 2 + 0.5,
        size: Math.random() * 2
    });
}

function startGame() {
    score = 0;
    hp = 3;
    level = 1;

    bullets = [];
    enemies = [];
    particles = [];

    player = {
        x: W / 2,
        y: H - 100,
        size: 22,
        speed: 7,
        cooldown: 0
    };

    document.getElementById("score").textContent = score;
    document.getElementById("hp").textContent = hp;
    document.getElementById("level").textContent = level;

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameOver").style.display = "none";

    running = true;

    requestAnimationFrame(gameLoop);
}

function shoot() {
    if (player.cooldown <= 0) {

        bullets.push({
            x: player.x,
            y: player.y - 25,
            speed: 12,
            size: 4
        });

        player.cooldown = 10;
    }
}

function spawnEnemy() {
    enemies.push({
        x: Math.random() * (W - 40) + 20,
        y: -30,
        size: Math.random() * 15 + 15,
        speed: Math.random() * 2 + 1 + level * 0.2,
        hp: 1
    });
}

let enemyTimer = 0;

function update() {

    // PLAYER
    if (keys["a"] || keys["arrowleft"]) {
        player.x -= player.speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.x += player.speed;
    }

    if (keys["w"] || keys["arrowup"]) {
        player.y -= player.speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
        player.y += player.speed;
    }

    player.x = Math.max(25, Math.min(W - 25, player.x));
    player.y = Math.max(60, Math.min(H - 30, player.y));

    if (keys.space) {
        shoot();
    }

    if (player.cooldown > 0) {
        player.cooldown--;
    }

    // BULLETS
    bullets.forEach(b => {
        b.y -= b.speed;
    });

    bullets = bullets.filter(b => b.y > -20);

    // ENEMIES
    enemyTimer--;

    if (enemyTimer <= 0) {
        spawnEnemy();
        enemyTimer = Math.max(15, 50 - level * 3);
    }

    enemies.forEach(e => {
        e.y += e.speed;
    });

    // COLLISION BULLET / ENEMY
    for (let i = enemies.length - 1; i >= 0; i--) {

        let e = enemies[i];

        for (let j = bullets.length - 1; j >= 0; j--) {

            let b = bullets[j];

            let dx = e.x - b.x;
            let dy = e.y - b.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < e.size + b.size) {

                createExplosion(e.x, e.y);

                enemies.splice(i, 1);
                bullets.splice(j, 1);

                score += 10;

                level = Math.floor(score / 200) + 1;

                document.getElementById("score").textContent = score;
                document.getElementById("level").textContent = level;

                break;
            }
        }
    }

    // ENEMY / PLAYER
    for (let i = enemies.length - 1; i >= 0; i--) {

        let e = enemies[i];

        let dx = e.x - player.x;
        let dy = e.y - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < e.size + player.size) {

            createExplosion(player.x, player.y);

            enemies.splice(i, 1);

            hp--;

            document.getElementById("hp").textContent = hp;

            if (hp <= 0) {
                gameOver();
            }
        }

        else if (e.y > H + 50) {

            enemies.splice(i, 1);

            hp--;

            document.getElementById("hp").textContent = hp;

            if (hp <= 0) {
                gameOver();
            }
        }
    }

    // PARTICLES
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.size *= 0.96;
    });

    particles = particles.filter(p => p.life > 0);

    // STARS
    stars.forEach(s => {
        s.y += s.speed + level * 0.2;

        if (s.y > H) {
            s.y = 0;
            s.x = Math.random() * W;
        }
    });
}

function draw() {

    ctx.clearRect(0, 0, W, H);

    // STARS
    ctx.fillStyle = "white";

    stars.forEach(s => {
        ctx.globalAlpha = Math.random() * 0.5 + 0.5;

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );
    });

    ctx.globalAlpha = 1;

    // PLAYER
    if (player) {

        ctx.save();

        ctx.translate(player.x, player.y);

        ctx.shadowBlur = 25;
        ctx.shadowColor = "#00ffff";

        ctx.fillStyle = "#00ffff";

        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(20, 20);
        ctx.lineTo(0, 12);
        ctx.lineTo(-20, 20);
        ctx.closePath();

        ctx.fill();

        // cockpit
        ctx.fillStyle = "#ff00ff";

        ctx.beginPath();
        ctx.arc(0, -5, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // BULLETS
    bullets.forEach(b => {

        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ffff00";

        ctx.fillStyle = "#ffff00";

        ctx.fillRect(
            b.x - 2,
            b.y - 10,
            4,
            15
        );
    });

    ctx.shadowBlur = 0;

    // ENEMIES
    enemies.forEach(e => {

        ctx.save();

        ctx.translate(e.x, e.y);

        ctx.shadowBlur = 25;
        ctx.shadowColor = "#ff0055";

        ctx.fillStyle = "#ff1744";

        ctx.beginPath();

        for (let i = 0; i < 8; i++) {

            let angle = i * Math.PI / 4;

            let radius =
                i % 2 === 0
                ? e.size
                : e.size * 0.55;

            ctx.lineTo(
                Math.cos(angle) * radius,
                Math.sin(angle) * radius
            );
        }

        ctx.closePath();
        ctx.fill();

        ctx.restore();
    });

    // PARTICLES
    particles.forEach(p => {

        ctx.globalAlpha = p.life / 30;

        ctx.fillStyle = "#00ffff";

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    });

    ctx.globalAlpha = 1;
}

function createExplosion(x, y) {

    for (let i = 0; i < 25; i++) {

        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 6 + 1;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 5 + 2,
            life: 30
        });
    }
}

function gameOver() {

    running = false;

    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameOver").style.display = "flex";
}

function gameLoop() {

    if (!running) return;

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

// MOBILE CONTROLS
document.getElementById("left").addEventListener("touchstart", () => {
    keys["arrowleft"] = true;
});

document.getElementById("left").addEventListener("touchend", () => {
    keys["arrowleft"] = false;
});

document.getElementById("right").addEventListener("touchstart", () => {
    keys["arrowright"] = true;
});

document.getElementById("right").addEventListener("touchend", () => {
    keys["arrowright"] = false;
});

document.getElementById("shoot").addEventListener("touchstart", () => {
    keys.space = true;
});

document.getElementById("shoot").addEventListener("touchend", () => {
    keys.space = false;
});
</script>

</body>
</html>
