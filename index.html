createBox(`
<h2>Snake</h2>

<canvas id="snakeCanvas"
width="240"
height="180"></canvas>

<button onclick="startSnakeGame()">start</button>

<div class="output">
score:
<span id="snakeScore">0</span>
</div>
`);

const snakeCanvas =
    document.getElementById("snakeCanvas");

const snakeContext =
    snakeCanvas.getContext("2d");

let snakeBody = [];
let snakeDirection = {x:1,y:0};
let snakeFood = {x:5,y:5};
let snakeInterval = null;
let snakePoints = 0;

function startSnakeGame(){

    clearInterval(snakeInterval);

    snakeBody = [
        {x:5,y:5},
        {x:4,y:5},
        {x:3,y:5}
    ];

    snakeDirection = {x:1,y:0};
    snakePoints = 0;

    document.getElementById("snakeScore").textContent=0;

    placeSnakeFood();

    snakeInterval =
        setInterval(updateSnakeGame,120);
}

function placeSnakeFood(){

    snakeFood = {
        x:Math.floor(Math.random()*12),
        y:Math.floor(Math.random()*9)
    };
}

function updateSnakeGame(){

    const head = {
        x:snakeBody[0].x + snakeDirection.x,
        y:snakeBody[0].y + snakeDirection.y
    };

    if(
        head.x<0 ||
        head.y<0 ||
        head.x>=12 ||
        head.y>=9 ||
        snakeBody.some(
            part =>
            part.x===head.x &&
            part.y===head.y
        )
    ){
        clearInterval(snakeInterval);
        return;
    }

    snakeBody.unshift(head);

    if(
        head.x===snakeFood.x &&
        head.y===snakeFood.y
    ){
        snakePoints++;

        document.getElementById(
            "snakeScore"
        ).textContent=snakePoints;

        placeSnakeFood();
    }
    else{
        snakeBody.pop();
    }

    snakeContext.clearRect(
        0,
        0,
        snakeCanvas.width,
        snakeCanvas.height
    );

    snakeContext.fillStyle="red";

    snakeContext.fillRect(
        snakeFood.x*20,
        snakeFood.y*20,
        18,
        18
    );

    snakeContext.fillStyle="lime";

    snakeBody.forEach(part=>{
        snakeContext.fillRect(
            part.x*20,
            part.y*20,
            18,
            18
        );
    });
}

document.addEventListener("keydown",function(event){

    if(
        event.key==="ArrowUp" &&
        snakeDirection.y!==1
    ){
        snakeDirection={x:0,y:-1};
    }

    if(
        event.key==="ArrowDown" &&
        snakeDirection.y!==-1
    ){
        snakeDirection={x:0,y:1};
    }

    if(
        event.key==="ArrowLeft" &&
        snakeDirection.x!==1
    ){
        snakeDirection={x:-1,y:0};
    }

    if(
        event.key==="ArrowRight" &&
        snakeDirection.x!==-1
    ){
        snakeDirection={x:1,y:0};
    }
});

let audioContext=null;

function makeBeep(frequency){

    if(!audioContext){
        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.frequency.value=frequency;

    gain.gain.value=.05;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime+.15
    );
}

/* =========================
   WIT SCHERM
========================= */

let whiteScreenRunning=false;

function showWhiteScreen(){

    if(whiteScreenRunning)return;

    whiteScreenRunning=true;

    whiteText.textContent=
        pickRandom(whiteNames);

    whiteOverlay.style.display="flex";

    setTimeout(function(){

        whiteOverlay.style.display="none";
        whiteScreenRunning=false;

    },2500+Math.random()*2500);
}

setInterval(function(){

    if(Math.random()<0.35){
        showWhiteScreen();
    }

},18000);


/* =========================
   RANDOM FLASH
========================= */

setInterval(function(){

    if(Math.random()<0.07){

        const flash =
            document.createElement("div");

        flash.style.position="fixed";
        flash.style.inset="0";
        flash.style.background="white";
        flash.style.zIndex="9500";
        flash.style.pointerEvents="none";

        document.body.appendChild(flash);

        setTimeout(function(){
            flash.remove();
        },80);
    }

},700);


/* =========================
   TITEL
========================= */

setInterval(function(){

    document.title=
        pickRandom([
            "site",
            "???",
            "AAAA",
            "42",
            "banana",
            "lol",
            "404",
            "kip"
        ]);

},300);


/* =========================
   START
========================= */

setTimeout(function(){

    for(let i=0;i<12;i++){
        createFloatingThing();
    }

},500);
