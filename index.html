<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
    transition:background .2s,filter .2s;
}

#world{
    min-height:100vh;
    padding:18px;
    display:flex;
    flex-wrap:wrap;
    align-items:flex-start;
    justify-content:center;
    gap:13px;
}

.box{
    position:relative;
    background:#111;
    border:1px solid #444;
    border-radius:15px;
    padding:14px;
    min-width:210px;
    max-width:430px;
    box-shadow:0 8px 30px #000b;
    overflow:hidden;
}

.box:nth-child(2n){
    transform:rotate(-1deg);
}

.box:nth-child(3n){
    transform:rotate(1.5deg);
}

.box:nth-child(5n){
    transform:rotate(-2deg);
}

button{
    background:#202020;
    color:white;
    border:1px solid #555;
    border-radius:9px;
    padding:9px 13px;
    margin:3px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:white;
    color:black;
}

button:active{
    transform:scale(.9);
}

input,textarea,select{
    width:100%;
    background:#050505;
    color:white;
    border:1px solid #555;
    border-radius:8px;
    padding:10px;
    margin:4px 0;
}

textarea{
    min-height:100px;
    resize:vertical;
    user-select:text;
}

.out{
    background:#050505;
    border:1px solid #333;
    border-radius:9px;
    padding:10px;
    min-height:40px;
    margin-top:7px;
    word-break:break-word;
}

.big{
    font-size:42px;
    font-weight:1000;
    text-align:center;
}

canvas{
    max-width:100%;
    background:#000;
    border:1px solid #444;
    border-radius:9px;
}

.color{
    height:90px;
    width:100%;
    border-radius:12px;
    border:2px solid #555;
}

.bar{
    height:24px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.bar div{
    height:100%;
    width:50%;
    background:linear-gradient(
        90deg,
        #f00,
        #ff0,
        #0f0,
        #0ff,
        #00f,
        #f0f
    );
}

#overlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:9000;
}

.glitch{
    position:absolute;
    font-family:monospace;
    font-weight:1000;
    pointer-events:none;
    text-shadow:
        3px 0 red,
        -3px 0 cyan,
        0 3px yellow;
}

.fly{
    position:absolute;
    font-weight:1000;
    white-space:nowrap;
    pointer-events:none;
}

.flash{
    position:fixed;
    inset:0;
    z-index:8999;
    pointer-events:none;
}

.scan{
    position:fixed;
    left:0;
    width:100%;
    height:3px;
    background:white;
    opacity:.12;
    z-index:8998;
    pointer-events:none;
    animation:scan 1s linear infinite;
}

@keyframes scan{
    from{top:-5px}
    to{top:100vh}
}

@keyframes flicker{
    0%{opacity:.05}
    20%{opacity:1}
    40%{opacity:.2}
    60%{opacity:1}
    100%{opacity:.1}
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@keyframes pulse{
    0%{transform:scale(.7)}
    50%{transform:scale(1.2)}
    100%{transform:scale(.7)}
}

#popup{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    color:black;
    padding:30px;
    border-radius:20px;
    z-index:10000;
    font-size:30px;
    font-weight:1000;
    box-shadow:0 20px 100px #000;
    transition:.15s;
    pointer-events:none;
}

#popup.show{
    transform:translate(-50%,-50%) scale(1);
}

#mouseZone{
    height:160px;
    border:2px dashed #555;
    border-radius:10px;
    position:relative;
    overflow:hidden;
}

#mouseDot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#0ff;
    position:absolute;
}

#terminal{
    height:220px;
    overflow:auto;
    background:#020202;
    color:#00ff66;
    font-family:monospace;
    padding:12px;
    border-radius:8px;
    user-select:text;
}

body.invert{
    filter:invert(1) hue-rotate(180deg);
}

body.blur{
    filter:blur(2px);
}

body.party{
    animation:party .3s infinite;
}

@keyframes party{
    0%{background:#16001d}
    25%{background:#001b1d}
    50%{background:#211800}
    75%{background:#001d0a}
    100%{background:#1d0000}
}

@media(max-width:600px){
    .box{
        width:100%;
        min-width:0;
    }
}
</style>

function calculate(){
    let x=document.getElementById("calc").value;

    try{
        if(!/^[0-9+\-*/(). %]+$/.test(x)) throw 0;

        document.getElementById("calcOut").textContent=
            Function("return "+x)();
    }catch{
        document.getElementById("calcOut").textContent="ERROR";
    }
}


function randomNumber(){
    let a=Number(document.getElementById("min").value);
    let b=Number(document.getElementById("max").value);

    if(a>b)[a,b]=[b,a];

    document.getElementById("randomNumber").textContent=
        Math.floor(Math.random()*(b-a+1))+a;
}

}

    document.getElementById("color").style.background=c;
    document.getElementById("colorCode").textContent=c;
}


let watchStart=0;
let watchInterval=null;

function startWatch(){

    if(watchInterval)return;

    watchStart=Date.now();

    watchInterval=setInterval(()=>{

        let ms=Date.now()-watchStart;

        let s=Math.floor(ms/1000);
        let m=Math.floor(s/60);

        s%=60;

        document.getElementById("stopwatch").textContent=
            String(m).padStart(2,"0")+":"+
            String(s).padStart(2,"0")+":"+
            String(Math.floor(ms%1000/10)).padStart(2,"0");

    },10);
}


function stopWatch(){
    clearInterval(watchInterval);
    watchInterval=null;
}


function resetWatch(){
    stopWatch();
    document.getElementById("stopwatch").textContent="00:00:00";
}

    cash+=Math.floor(Math.random()*100000);

function reverseText(){

let audio;

function tone(freq){

    audio=audio||new AudioContext();

    let osc=audio.createOscillator();
    let gain=audio.createGain();

    osc.frequency.value=freq;

    osc.connect(gain);
    gain.connect(audio.destination);

    gain.gain.value=.07;

    osc.start();

    osc.stop(audio.currentTime+.15);
}

}

/* TARGET */

const targetCanvas=document.getElementById("target");
const targetCtx=targetCanvas.getContext("2d");

let targetX=100;
let targetY=100;
let targetScore=0;

function newTarget(){

    targetCtx.clearRect(0,0,360,210);

    targetX=30+Math.random()*300;
    targetY=30+Math.random()*150;

    targetCtx.fillStyle="#f00";

    targetCtx.beginPath();
    targetCtx.arc(targetX,targetY,25,0,Math.PI*2);
    targetCtx.fill();

    targetCtx.fillStyle="#fff";

    targetCtx.beginPath();
    targetCtx.arc(targetX,targetY,11,0,Math.PI*2);
    targetCtx.fill();
}

targetCanvas.onclick=e=>{

    let r=targetCanvas.getBoundingClientRect();

    let x=(e.clientX-r.left)*360/r.width;
    let y=(e.clientY-r.top)*210/r.height;

    if(Math.hypot(x-targetX,y-targetY)<30){

        targetScore++;

        document.getElementById("score").textContent=
            targetScore;

        newTarget();
    }
};

newTarget();


function rps(player){

    let c=["🪨","📄","✂️"];
    let cpu=random(c);

    let result;

    if(player===cpu)
        result="gelijk";

    else if(
        player==="🪨"&&cpu==="✂️" ||
        player==="📄"&&cpu==="🪨" ||
        player==="✂️"&&cpu==="📄"
    )
        result="jij";

    else
        result="computer";

    document.getElementById("rps").textContent=
        player+" "+cpu+" "+result;
}

            notify(random(words));

    },1000);
}

function makeGraph(){

    let c=document.getElementById("graph");
    let x=c.getContext("2d");

    x.clearRect(0,0,360,210);

    x.strokeStyle=
        `hsl(${Math.random()*360},100%,60%)`;

    x.lineWidth=3;

    x.beginPath();

    for(let i=0;i<360;i+=5){

        let y=105+
            Math.sin(i/15)*50+
            (Math.random()-.5)*70;

        if(i===0)x.moveTo(i,y);
        else x.lineTo(i,y);
    }

    x.stroke();
}

/* ================================

================================ */

const snakeCanvas=document.getElementById("snake");
const snakeCtx=snakeCanvas.getContext("2d");

let snake=[];
let food={x:10,y:10};
let snakeDir={x:1,y:0};
let snakeGame=null;
let snakePoints=0;

function startSnake(){

    clearInterval(snakeGame);

    snake=[
        {x:8,y:8},
        {x:7,y:8},
        {x:6,y:8}
    ];

    snakeDir={x:1,y:0};
    snakePoints=0;

    placeFood();

    snakeGame=setInterval(updateSnake,110);
}

function placeFood(){

    food={
        x:Math.floor(Math.random()*18),
        y:Math.floor(Math.random()*11)
    };
}

function updateSnake(){

    let head={
        x:snake[0].x+snakeDir.x,
        y:snake[0].y+snakeDir.y
    };

    if(
        head.x<0||
        head.x>=18||
        head.y<0||
        head.y>=11||
        snake.some(s=>s.x===head.x&&s.y===head.y)
    ){
        clearInterval(snakeGame);
        return;
    }

    snake.unshift(head);

    if(head.x===food.x&&head.y===food.y){

        snakePoints++;

        document.getElementById("snakeScore")
        .textContent=snakePoints;

        placeFood();

    }else{
        snake.pop();
    }

    drawSnake();
}

function drawSnake(){

    snakeCtx.clearRect(0,0,360,220);

    snakeCtx.fillStyle="#f00";

    snakeCtx.fillRect(
        food.x*20,
        food.y*20,
        18,
        18
    );

    snakeCtx.fillStyle="#0f0";

    snake.forEach(s=>{
        snakeCtx.fillRect(
            s.x*20,
            s.y*20,
            18,
            18
        );
    });
}

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowUp"&&snakeDir.y!==1)
        snakeDir={x:0,y:-1};

    if(e.key==="ArrowDown"&&snakeDir.y!==-1)
        snakeDir={x:0,y:1};

    if(e.key==="ArrowLeft"&&snakeDir.x!==1)
        snakeDir={x:-1,y:0};

    if(e.key==="ArrowRight"&&snakeDir.x!==-1)
        snakeDir={x:1,y:0};
});


/* ================================
   BREAKOUT
================================ */

const bc=document.getElementById("breakout");
const bx=bc.getContext("2d");

let breakoutRunning=false;
let ball={x:180,y:170,dx:3,dy:-3,r:6};
let paddle={x:145,w:70};
let bricks=[];

function startBreakout(){

    bricks=[];

    for(let r=0;r<4;r++){

        for(let c=0;c<8;c++){

            bricks.push({
                x:c*45+2,
                y:r*22+10,
                w:40,
                h:17,
                alive:true
            });
        }
    }

    ball={
        x:180,
        y:170,
        dx:3,
        dy:-3,
        r:6
    };

    paddle.x=145;
    breakoutRunning=true;

    requestAnimationFrame(breakoutLoop);
}

function breakoutLoop(){

    if(!breakoutRunning)return;

    bx.clearRect(0,0,360,220);

    bricks.forEach(b=>{

        if(b.alive){

            bx.fillStyle=
                `hsl(${b.x+b.y},100%,60%)`;

            bx.fillRect(
                b.x,b.y,b.w,b.h
            );
        }
    });

    bx.fillStyle="white";

    bx.fillRect(
        paddle.x,
        205,
        paddle.w,
        8
    );

    bx.beginPath();

    bx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    bx.fill();

    ball.x+=ball.dx;
    ball.y+=ball.dy;

    if(ball.x<0||ball.x>360)
        ball.dx*=-1;

    if(ball.y<0)
        ball.dy*=-1;

    if(
        ball.y>195 &&
        ball.x>paddle.x &&
        ball.x<paddle.x+paddle.w
    ){
        ball.dy=-Math.abs(ball.dy);
    }

    bricks.forEach(b=>{

        if(
            b.alive &&
            ball.x>b.x &&
            ball.x<b.x+b.w &&
            ball.y>b.y &&
            ball.y<b.y+b.h
        ){

            b.alive=false;
            ball.dy*=-1;
        }
    });

    if(ball.y>230)
        breakoutRunning=false;

    requestAnimationFrame(breakoutLoop);
}

bc.addEventListener("mousemove",e=>{

    let r=bc.getBoundingClientRect();

    paddle.x=
        (e.clientX-r.left)*360/r.width-
        paddle.w/2;
});
