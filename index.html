<html>
    <head>
<img src=https://nevadasagebrush.com/wp-content/uploads/2026/09/image-5.png alt="Afbeelding">
<textarea name="ja" id="ja"></textarea>
<time datetime="tijd"></time>
<search></search>
    </head>

    <body>
        Dit is mijn eerste website! torrie torrie torrie torrie adam torrie
<!-- GRAFFITI SPRAY BLOK -->
<div id="graffitiTool" style="
    width: 340px;
    max-width: 100%;
    margin: 30px auto;
    padding: 18px;
    background: #181818;
    color: white;
    border-radius: 18px;
    font-family: Arial, sans-serif;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,.35);
    position: relative;
    z-index: 99999;
">

    <h2 style="margin:0 0 5px;">🎨 Graffiti Spray</h2>

    <p style="
        color:#aaa;
        font-size:14px;
        margin:5px 0 15px;
    ">
        Kies een spuitbus en spray over de website!
    </p>

    <div style="
        display:flex;
        justify-content:center;
        gap:10px;
        flex-wrap:wrap;
        margin-bottom:15px;
    ">

        <button class="sprayColor" data-color="#ff0055"
            style="background:#ff0055;">
            🧴
        </button>

        <button class="sprayColor" data-color="#00e5ff"
            style="background:#00e5ff;">
            🧴
        </button>

        <button class="sprayColor" data-color="#7dff00"
            style="background:#7dff00;">
            🧴
        </button>

        <button class="sprayColor" data-color="#fff000"
            style="background:#fff000;">
            🧴
        </button>

        <button class="sprayColor" data-color="#9b00ff"
            style="background:#9b00ff;">
            🧴
        </button>

        <button class="sprayColor" data-color="#ffffff"
            style="background:white;">
            🧴
        </button>

    </div>

    <div style="margin-bottom:12px;">
        <label style="font-size:13px;">Spray-grootte</label>
        <input id="spraySize" type="range"
            min="10" max="100" value="45"
            style="width:180px; vertical-align:middle;">
    </div>

    <button id="sprayMode" style="
        border:0;
        border-radius:10px;
        padding:10px 18px;
        background:#333;
        color:white;
        font-weight:bold;
        cursor:pointer;
    ">
        🎨 Spray aan
    </button>

    <button id="clearGraffiti" style="
        border:0;
        border-radius:10px;
        padding:10px 18px;
        background:#b71c1c;
        color:white;
        font-weight:bold;
        cursor:pointer;
        margin-left:5px;
    ">
        🗑️ Wis
    </button>
</div>


<!-- GRAFFITI LAAG OVER DE HELE WEBSITE -->
<canvas id="graffitiCanvas"></canvas>

<style>
    .sprayColor {
        width:48px;
        height:58px;
        border:3px solid #555;
        border-radius:10px;
        cursor:pointer;
        font-size:23px;
        transition:.15s;
        box-shadow: inset 0 -8px 0 rgba(0,0,0,.2);
    }

    .sprayColor:hover {
        transform:translateY(-4px) rotate(-3deg);
        border-color:white;
    }

    .sprayColor.selected {
        transform:translateY(-5px) scale(1.08);
        border-color:white;
        box-shadow:
            0 0 0 3px #111,
            0 0 15px white,
            inset 0 -8px 0 rgba(0,0,0,.2);
    }

    #graffitiCanvas {
        position:fixed;
        left:0;
        top:0;
        width:100vw;
        height:100vh;
        pointer-events:none;
        z-index:99998;
    }

    body.graffitiActive {
        cursor:crosshair;
    }
</style>


<script>
(function() {

    const canvas = document.getElementById("graffitiCanvas");
    const ctx = canvas.getContext("2d");

    const sizeSlider = document.getElementById("spraySize");
    const sprayMode = document.getElementById("sprayMode");
    const clearButton = document.getElementById("clearGraffiti");
    const colorButtons = document.querySelectorAll(".sprayColor");

    let currentColor = "#ff0055";
    let spraySize = 45;
    let spraying = false;
    let active = false;

    // Canvas precies zo groot maken als het scherm
    function resizeCanvas() {
        const oldCanvas = document.createElement("canvas");
        oldCanvas.width = canvas.width;
        oldCanvas.height = canvas.height;

        if (canvas.width && canvas.height) {
            oldCanvas.getContext("2d").drawImage(canvas, 0, 0);
        }

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        if (oldCanvas.width && oldCanvas.height) {
            ctx.drawImage(oldCanvas, 0, 0);
        }
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // Kleur kiezen
    colorButtons.forEach(button => {

        button.addEventListener("click", function() {

            currentColor = this.dataset.color;

            colorButtons.forEach(b =>
                b.classList.remove("selected")
            );

            this.classList.add("selected");

            active = true;
            document.body.classList.add("graffitiActive");

            sprayMode.textContent = "🎨 Spray aan";
        });

    });

    // Eerste kleur selecteren
    colorButtons[0].classList.add("selected");

    // Grootte aanpassen
    sizeSlider.addEventListener("input", function() {
        spraySize = Number(this.value);
    });


    // Spray maken
    function spray(x, y) {

        const amount = 35;

        for (let i = 0; i < amount; i++) {

            const angle = Math.random() * Math.PI * 2;

            const distance =
                Math.random() * spraySize;

            const px =
                x + Math.cos(angle) * distance;

            const py =
                y + Math.sin(angle) * distance;

            const dotSize =
                Math.random() * 2.5 + 0.7;

            ctx.globalAlpha =
                Math.random() * 0.55 + 0.25;

            ctx.fillStyle = currentColor;

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                dotSize,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        // paar grotere spetters
        for (let i = 0; i < 4; i++) {

            const angle = Math.random() * Math.PI * 2;

            const distance =
                Math.random() * spraySize * 1.5;

            const px =
                x + Math.cos(angle) * distance;

            const py =
                y + Math.sin(angle) * distance;

            ctx.globalAlpha = .5;
            ctx.fillStyle = currentColor;

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                Math.random() * 4 + 1,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.globalAlpha = 1;
    }


    // Muis indrukken
    canvas.addEventListener("mousedown", function(e) {

        if (!active) return;

        spraying = true;

        spray(e.clientX, e.clientY);
    });


    // Muis loslaten
    window.addEventListener("mouseup", function() {
        spraying = false;
    });


    // Slepen
    canvas.addEventListener("mousemove", function(e) {

        if (!active || !spraying) return;

        spray(e.clientX, e.clientY);
    });


    // Touchscreen ondersteuning
    canvas.addEventListener("touchstart", function(e) {

        if (!active) return;

        e.preventDefault();

        spraying = true;

        const touch = e.touches[0];

        spray(
            touch.clientX,
            touch.clientY
        );

    }, {passive:false});


    canvas.addEventListener("touchmove", function(e) {

        if (!active || !spraying) return;

        e.preventDefault();

        const touch = e.touches[0];

        spray(
            touch.clientX,
            touch.clientY
        );

    }, {passive:false});


    canvas.addEventListener("touchend", function() {
        spraying = false;
    });


    // Spray aan/uit
    sprayMode.addEventListener("click", function() {

        active = !active;

        if (active) {

            document.body.classList.add("graffitiActive");

            this.textContent = "🎨 Spray aan";

        } else {

            document.body.classList.remove("graffitiActive");

            this.textContent = "🚫 Spray uit";

        }

    });


    // Alles wissen
    clearButton.addEventListener("click", function() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    });

})();
</script>
    </body>
   
</html>
