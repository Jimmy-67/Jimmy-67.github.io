<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#777;
    color:#111;
    font-family:"Comic Sans MS",Arial,sans-serif;
    overflow-x:hidden;
}

#main{
    padding:7px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:flex-start;
}

.box{
    background:#ddd;
    border:4px ridge #555;
    padding:8px;
    width:270px;
    min-height:100px;
    position:relative;
}

.box:nth-child(2n){
    background:#ffaaaa;
}

.box:nth-child(3n){
    background:#aaffaa;
}

.box:nth-child(4n){
    background:#aaaaff;
}

.box:nth-child(5n){
    background:#ffff77;
}

h2{
    font-size:21px;
    margin:0 0 8px 0;
    color:#111;
    text-decoration:underline;
}

button{
    background:#ccc;
    border:3px outset #eee;
    padding:6px 10px;
    margin:2px;
    font-family:inherit;
    cursor:pointer;
}

button:active{
    border-style:inset;
}

input,textarea{
    width:100%;
    padding:7px;
    border:3px inset #aaa;
    background:#fff;
    color:#000;
    font-family:Arial;
}

textarea{
    height:90px;
}

.output{
    background:white;
    border:2px inset #999;
    padding:6px;
    min-height:28px;
    margin-top:5px;
}

.big{
    font-size:35px;
    font-weight:bold;
    text-align:center;
}

img{
    max-width:100%;
    max-height:230px;
    display:block;
    margin:3px auto;
    border:5px solid #000;
}

canvas{
    background:white;
    border:4px solid #222;
    max-width:100%;
}

#mess{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9000;
    overflow:hidden;
}

.random{
    position:absolute;
    font-weight:bold;
    font-size:30px;
    animation:moveRandom 1.4s linear forwards;
}

@keyframes moveRandom{
    0%{
        transform:translate(0,0) rotate(0deg);
        opacity:1;
    }
    50%{
        transform:translate(300px,-100px) rotate(180deg);
    }
    100%{
        transform:translate(-400px,300px) rotate(700deg);
        opacity:0;
    }
}

#whiteScreen{
    position:fixed;
    inset:0;
    background:white;
    z-index:99999;
    display:none;
    color:black;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    font-size:70px;
    font-weight:bold;
}

#whiteName{
    animation:nameWiggle .08s infinite;
}

@keyframes nameWiggle{
    0%{transform:translate(0,0)}
    25%{transform:translate(7px,-3px)}
    50%{transform:translate(-5px,5px)}
    75%{transform:translate(4px,2px)}
    100%{transform:translate(0,0)}
}

.flash{
    position:fixed;
    inset:0;
    background:white;
    z-index:9500;
    pointer-events:none;
}

.spin{
    animation:spin .3s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.shake{
    animation:shake .1s infinite;
}

@keyframes shake{
    0%{transform:translate(0)}
    25%{transform:translate(5px,-3px)}
    50%{transform:translate(-4px,4px)}
    75%{transform:translate(3px,2px)}
    100%{transform:translate(0)}
}

#terminal{
    background:#000;
    color:#00ff00;
    height:170px;
    overflow:auto;
    padding:8px;
    font-family:monospace;
}

.memeText{
    font-size:28px;
    font-weight:bold;
    text-align:center;
    background:#fff;
    color:#000;
    padding:5px;
}

.marquee{
    overflow:hidden;
    white-space:nowrap;
}

.marquee span{
    display:inline-block;
    animation:marquee 3s linear infinite;
}

@keyframes marquee{
    from{transform:translateX(100%)}
    to{transform:translateX(-100%)}
}
</style>
</head>

/* SNAKE */

addBox(`
<h2>Snake</h2>
<canvas id="snake" width="250" height="180"></canvas>
<button onclick="startSnake()">start</button>
<div class="output" id="snakeScore">0</div>
`);

const sc=document.getElementById("snake");
const sx=sc.getContext("2d");

let snake=[];
let food={x:5,y:5};
let dir={x:1,y:0};
let snakeTimer;
let snakeScore=0;

function startSnake(){

    clearInterval(snakeTimer);

    snake=[
        {x:5,y:5},
        {x:4,y:5},
        {x:3,y:5}
    ];

    dir={x:1,y:0};
    snakeScore=0;
    food={
        x:Math.floor(Math.random()*12),
        y:Math.floor(Math.random()*9)
    };

    snakeTimer=setInterval(updateSnake,130);
}

function updateSnake(){

    let head={
        x:snake[0].x+dir.x,
        y:snake[0].y+dir.y
    };

    if(
        head.x<0||
        head.y<0||
        head.x>=12||
        head.y>=9||
        snake.some(x=>x.x===head.x&&x.y===head.y)
    ){
        clearInterval(snakeTimer);
        return;
    }

    snake.unshift(head);

    if(head.x===food.x&&head.y===food.y){

        snakeScore++;

        document.getElementById("snakeScore").textContent=
            snakeScore;

        food={
            x:Math.floor(Math.random()*12),
            y:Math.floor(Math.random()*9)
        };

    }else{
        snake.pop();
    }

    sx.clearRect(0,0,250,180);

    sx.fillStyle="red";
    sx.fillRect(food.x*20,food.y*20,18,18);

    sx.fillStyle="lime";

    snake.forEach(x=>{
        sx.fillRect(x.x*20,x.y*20,18,18);
    });
}

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowUp"&&dir.y!==1)
        dir={x:0,y:-1};

    if(e.key==="ArrowDown"&&dir.y!==-1)
        dir={x:0,y:1};

    if(e.key==="ArrowLeft"&&dir.x!==1)
        dir={x:-1,y:0};

    if(e.key==="ArrowRight"&&dir.x!==-1)
        dir={x:1,y:0};
});

<button onclick="beep(100)">laag</button>

<button onclick="beep(1500)">hoog</button>
`);

let audio;

function beep(freq){

    audio=audio||new AudioContext();

    let osc=audio.createOscillator();
    let gain=audio.createGain();

    osc.frequency.value=freq;

    osc.connect(gain);
    gain.connect(audio.destination);

    gain.gain.value=.05;

    osc.start();
    osc.stop(audio.currentTime+.15);
}
