```html
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUCAS</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #050505;
        font-family: Arial, sans-serif;
        position: relative;
    }

    /* Grote dansende LUCAS */
    .lucas {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        font-size: 20vw;
        font-weight: 900;
        letter-spacing: 10px;

        color: #00ffff;

        text-shadow:
            0 0 10px #00ffff,
            0 0 30px #00ffff,
            0 0 60px #ff00ff,
            0 0 100px #ff00ff;

        animation: dansen 1.2s infinite ease-in-out;

        white-space: nowrap;

        z-index: 1;
    }

    /* Dansanimatie */
    @keyframes dansen {

        0% {
            transform:
                translate(-50%, -50%)
                rotate(-8deg)
                scale(1);
        }

        25% {
            transform:
                translate(-50%, -60%)
                rotate(8deg)
                scale(1.15);
        }

        50% {
            transform:
                translate(-50%, -40%)
                rotate(-8deg)
                scale(0.9);
        }

        75% {
            transform:
                translate(-50%, -60%)
                rotate(8deg)
                scale(1.15);
        }

        100% {
            transform:
                translate(-50%, -50%)
                rotate(-8deg)
                scale(1);
        }
    }

    /* Kleur verandert continu */
    .lucas {
        animation:
            dansen 1.2s infinite ease-in-out,
            kleuren 3s infinite linear;
    }

    @keyframes kleuren {

        0% {
            color: #00ffff;
            filter: hue-rotate(0deg);
        }

        25% {
            color: #ff00ff;
            filter: hue-rotate(90deg);
        }

        50% {
            color: #ffff00;
            filter: hue-rotate(180deg);
        }

        75% {
            color: #00ff66;
            filter: hue-rotate(270deg);
        }

        100% {
            color: #00ffff;
            filter: hue-rotate(360deg);
        }
    }

    /* Kleine tekst vooraan */
    .tekst {
        position: absolute;

        top: 20px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 5;

        color: white;

        font-size: 25px;
        font-weight: bold;

        text-shadow: 0 0 15px white;
    }

    /* Knop */
    button {
        position: absolute;

        bottom: 30px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 5;

        padding: 15px 35px;

        font-size: 20px;
        font-weight: bold;

        color: white;

        background: rgba(0,0,0,0.5);

        border: 2px solid white;
        border-radius: 15px;

        cursor: pointer;

        transition: 0.2s;
    }

    button:hover {
        transform:
            translateX(-50%)
            scale(1.1);

        box-shadow:
            0 0 20px white,
            0 0 50px #ff00ff;
    }

</style>
</head>

<body>

<div class="tekst">
    🔥 DE LEGENDARISCHE LUCAS 🔥
</div>

<div class="lucas" id="lucas">
    LUCAS
</div>

<button onclick="megaLucas()">
    MEGA LUCAS
</button>

<script>

function megaLucas() {

    const lucas = document.getElementById("lucas");

    lucas.style.fontSize = "35vw";

    lucas.style.animationDuration = "0.3s";

    setTimeout(() => {

        lucas.style.fontSize = "20vw";

        lucas.style.animationDuration = "1.2s";

    }, 3000);

}

</script>

</body>
</html>
```
