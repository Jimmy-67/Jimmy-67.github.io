<html>
    <head>
<img src=https://nevadasagebrush.com/wp-content/uploads/2026/09/image-5.png alt="Afbeelding">

<search></search>
    </head>

    <body>
        Dit is mijn eerste website! torrie torrie torrie torrie adam torrie
<!-- UGLY GRAFFITI TOOL -->
<div id="graffitiTool">

    <div class="uglyTitle">
        💀 GRAFFITI SPUIT 3000 💀
    </div>

    <div class="uglySub">
        KLIK OP EEN BUS EN SPUIT OVERAL!!!
    </div>

    <div class="sprayButtons">

        <button class="sprayColor selected" data-color="#ff0055"
            style="background:#ff0055;">🧴</button>

        <button class="sprayColor" data-color="#00ffff"
            style="background:#00ffff;">🧴</button>

        <button class="sprayColor" data-color="#39ff14"
            style="background:#39ff14;">🧴</button>

        <button class="sprayColor" data-color="#ffff00"
            style="background:#ffff00;">🧴</button>

        <button class="sprayColor" data-color="#9900ff"
            style="background:#9900ff;">🧴</button>

        <button class="sprayColor" data-color="#ff6600"
            style="background:#ff6600;">🧴</button>

    </div>

    <div class="uglyControls">

        <span>GROOTTE:</span>

        <input id="spraySize"
            type="range"
            min="10"
            max="120"
            value="45">

    </div>

    <div class="uglyButtons">

        <button id="sprayMode">
            🎨 SPRAY AAN
        </button>

        <button id="clearGraffiti">
            💣 ALLES WEG
        </button>

    </div>

    <div id="sprayStatus">
        STATUS: KLAAR OM TE SPUITEN
    </div>

</div>


<!-- TRANSPARANTE GRAFFITI LAAG -->
<canvas id="graffitiCanvas"></canvas>


<style>

#graffitiTool {
    width: 350px;
    max-width: 90%;
    margin: 30px auto;

    padding: 12px;

    background:
        repeating-linear-gradient(
            45deg,
            #ff00ff 0px,
            #ff00ff 10px,
            #00ffff 10px,
            #00ffff 20px
        );

    border: 7px dotted black;

    box-shadow:
        10px 10px 0px black,
        -5px -5px 0px yellow;

    font-family: "Comic Sans MS", cursive;
    text-align: center;

    position: relative;
    z-index: 100000;
}

.uglyTitle {
    background: yellow;
    color: red;

    border: 5px solid black;

    padding: 8px;

    font-size: 23px;
    font-weight: bold;

    transform: rotate(-2deg);

    text-shadow:
        3px 3px white;
}

.uglySub {
    margin-top: 10px;

    background: black;
    color: lime;

    padding: 7px;

    border: 3px solid red;

    font-size: 12px;
}

.sprayButtons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;

    gap: 8px;

    margin: 15px 0;
}

.sprayColor {

    width: 45px;
    height: 55px;

    border: 5px solid black;

    cursor: pointer;

    font-size: 24px;

    box-shadow:
        4px 4px 0 black;

    transition: .1s;
}

.sprayColor:nth-child(2) {
    transform: rotate(4deg);
}

.sprayColor:nth-child(3) {
    transform: rotate(-5deg);
}

.sprayColor:nth-child(4) {
    transform: rotate(3deg);
}

.sprayColor:nth-child(5) {
    transform: rotate(-4deg);
}

.sprayColor:hover {
    transform: scale(1.15) rotate(10deg);
}

.sprayColor.selected {

    border-color: white;

    box-shadow:
        0 0 0 5px black,
        0 0 15px white;

    transform: scale(1.15) rotate(-5deg);
}

.uglyControls {

    background: orange;

    border: 4px solid black;

    padding: 8px;

    margin-bottom: 10px;

    font-weight: bold;
}

#spraySize {
    width: 150px;
}

.uglyButtons {

    display: flex;
    justify-content: center;
    gap: 8px;

    flex-wrap: wrap;
}

.uglyButtons button {

    padding: 10px;

    border: 5px solid black;

    font-family: "Comic Sans MS", cursive;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 4px 4px 0 black;
}

#sprayMode {
    background: lime;
}

#clearGraffiti {
    background: red;
    color: white;
}

#sprayMode:active,
#clearGraffiti:active {
    transform: translate(4px, 4px);
    box-shadow: none;
}

#sprayStatus {

    margin-top: 12px;

    background: white;

    color: black;

    border: 4px dashed black;

    padding: 6px;

    font-size: 11px;
}


/* DE GRAFFITI-LAAG */
#graffitiCanvas {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    z-index: 99999;

    pointer-events: none;
}


/* Muiscursor wanneer spray aan staat */
body.graffitiActive {
    cursor: crosshair !important;
}

</style>


<script>

(function() {

    const canvas =
        document.getElementById("graffitiCanvas");

    const ctx =
        canvas.getContext("2d");

    const sizeSlider =
        document.getElementById("spraySize");

    const sprayMode =
        document.getElementById("sprayMode");

    const clearButton =
        document.getElementById("clearGraffiti");

    const status =
        document.getElementById("sprayStatus");

    const colorButtons =
        document.querySelectorAll(".sprayColor");


    let currentColor = "#ff0055";

    let spraySize = 45;

    let spraying = false;

    let active = true;


    /* CANVAS GOED INSTELLEN */

    function resizeCanvas() {

        const oldCanvas =
            document.createElement("canvas");

        oldCanvas.width = canvas.width;
        oldCanvas.height = canvas.height;

        if (canvas.width > 0 && canvas.height > 0) {

            oldCanvas
                .getContext("2d")
                .drawImage(canvas, 0, 0);

        }

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        if (oldCanvas.width > 0) {

            ctx.drawImage(
                oldCanvas,
                0,
                0,
                oldCanvas.width,
                oldCanvas.height,
                0,
                0,
                canvas.width,
                canvas.height
            );

        }

    }

    resizeCanvas();

    window.addEventListener(
        "resize",
        resizeCanvas
    );


    /* KLEUR KIEZEN */

    colorButtons.forEach(button => {

        button.addEventListener(
            "click",
            function() {

                currentColor =
                    this.dataset.color;

                colorButtons.forEach(b =>
                    b.classList.remove("selected")
                );

                this.classList.add("selected");

                active = true;

                sprayMode.textContent =
                    "🎨 SPRAY AAN";

                status.textContent =
                    "STATUS: SPUITEN MET " +
                    currentColor;

                document.body
                    .classList
                    .add("graffitiActive");

            }
        );

    });


    /* GROOTTE */

    sizeSlider.addEventListener(
        "input",
        function() {

            spraySize =
                Number(this.value);

        }
    );


    /* SPRAY FUNCTIE */

    function spray(x, y) {

        if (!active) return;


        /*
         * Veel kleine puntjes
         * rond de muispositie.
         */

        for (
            let i = 0;
            i < 45;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const distance =
                Math.random() *
                spraySize;

            const px =
                x +
                Math.cos(angle) *
                distance;

            const py =
                y +
                Math.sin(angle) *
                distance;

            const radius =
                Math.random() * 3 + 0.5;


            ctx.globalAlpha =
                Math.random() * 0.7 + 0.2;

            ctx.fillStyle =
                currentColor;

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }


        /*
         * Grotere verfspetters
         */

        for (
            let i = 0;
            i < 7;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const distance =
                Math.random() *
                spraySize * 1.8;

            const px =
                x +
                Math.cos(angle) *
                distance;

            const py =
                y +
                Math.sin(angle) *
                distance;

            ctx.globalAlpha = .65;

            ctx.fillStyle =
                currentColor;

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                Math.random() * 5 + 1,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

        ctx.globalAlpha = 1;

    }


    /*
     * BELANGRIJK:
     *
     * Omdat de canvas pointer-events:none heeft,
     * luisteren we naar de hele pagina.
     */

    document.addEventListener(
        "mousedown",
        function(e) {

            if (!active) return;

            /*
             * Niet sprayen wanneer
             * je de knoppen gebruikt.
             */

            if (
                e.target.closest("#graffitiTool")
            ) {
                return;
            }

            spraying = true;

            spray(
                e.clientX,
                e.clientY
            );

        }
    );


    document.addEventListener(
        "mouseup",
        function() {

            spraying = false;

        }
    );


    document.addEventListener(
        "mousemove",
        function(e) {

            if (!active) return;

            if (!spraying) return;

            if (
                e.target.closest("#graffitiTool")
            ) {
                return;
            }

            spray(
                e.clientX,
                e.clientY
            );

        }
    );


    /* TOUCH */

    document.addEventListener(
        "touchstart",
        function(e) {

            if (!active) return;

            if (
                e.target.closest("#graffitiTool")
            ) {
                return;
            }

            spraying = true;

            const touch =
                e.touches[0];

            spray(
                touch.clientX,
                touch.clientY
            );

        },
        {passive:true}
    );


    document.addEventListener(
        "touchmove",
        function(e) {

            if (!active) return;

            if (!spraying) return;

            const touch =
                e.touches[0];

            spray(
                touch.clientX,
                touch.clientY
            );

        },
        {passive:true}
    );


    document.addEventListener(
        "touchend",
        function() {

            spraying = false;

        }
    );


    /* AAN / UIT */

    sprayMode.addEventListener(
        "click",
        function() {

            active = !active;

            if (active) {

                this.textContent =
                    "🎨 SPRAY AAN";

                status.textContent =
                    "STATUS: KLAAR OM TE SPUITEN";

                document.body
                    .classList
                    .add("graffitiActive");

            } else {

                this.textContent =
                    "🚫 SPRAY UIT";

                status.textContent =
                    "STATUS: UITGESCHAKELD";

                document.body
                    .classList
                    .remove("graffitiActive");

                spraying = false;

            }

        }
    );


    /* ALLES WISSEN */

    clearButton.addEventListener(
        "click",
        function() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            status.textContent =
                "STATUS: ALLES WEG 💀";

        }
    );


    document.body
        .classList
        .add("graffitiActive");

})();

</script>
    </body>
   
</html>
