<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameZone - Free Games</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #0b0d13;
    --panel: #151925;
    --panel2: #1d2230;
    --text: #ffffff;
    --muted: #9da5b5;
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --danger: #ff4757;
    --shadow: 0 15px 40px rgba(0,0,0,.35);
}

body.light {
    --bg: #f3f5fa;
    --panel: #ffffff;
    --panel2: #e9edf5;
    --text: #171923;
    --muted: #687080;
    --shadow: 0 10px 30px rgba(0,0,0,.12);
}

body {
    background:
        radial-gradient(circle at 10% 10%, rgba(108,92,231,.18), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(0,206,201,.12), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11,13,19,.88);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

body.light header {
    background: rgba(255,255,255,.88);
}

.nav {
    max-width: 1400px;
    margin: auto;
    height: 72px;
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 0 20px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    white-space: nowrap;
}

.logo span {
    color: var(--accent);
}

.search {
    flex: 1;
    position: relative;
}

.search input {
    width: 100%;
    padding: 13px 18px 13px 45px;
    border: none;
    outline: none;
    border-radius: 15px;
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    border: 1px solid rgba(255,255,255,.06);
}

.search-icon {
    position: absolute;
    left: 16px;
    top: 12px;
}

.nav-buttons {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 13px;
    cursor: pointer;
    background: var(--panel);
    color: var(--text);
    font-size: 18px;
    transition: .2s;
}

.icon-btn:hover {
    transform: translateY(-2px);
    background: var(--panel2);
}

/* HERO */

.hero {
    max-width: 1400px;
    margin: 30px auto;
    padding: 0 20px;
}

.hero-box {
    min-height: 250px;
    border-radius: 25px;
    padding: 45px;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(135deg, rgba(108,92,231,.95), rgba(20,184,166,.75)),
        var(--panel);
    box-shadow: var(--shadow);
}

.hero-box::before,
.hero-box::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
}

.hero-box::before {
    width: 350px;
    height: 350px;
    right: -80px;
    top: -160px;
}

.hero-box::after {
    width: 220px;
    height: 220px;
    right: 220px;
    bottom: -150px;
}

.hero h1 {
    font-size: clamp(35px, 6vw, 65px);
    position: relative;
    z-index: 2;
}

.hero p {
    margin-top: 12px;
    font-size: 18px;
    opacity: .9;
    position: relative;
    z-index: 2;
}

.hero button {
    margin-top: 25px;
    border: none;
    padding: 13px 23px;
    border-radius: 13px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    position: relative;
    z-index: 2;
}

/* CATEGORIES */

.categories {
    max-width: 1400px;
    margin: 0 auto 25px;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
}

.category {
    padding: 10px 17px;
    border: none;
    border-radius: 20px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: .2s;
}

.category:hover,
.category.active {
    background: var(--accent);
    color: white;
}

/* GAMES */

.container {
    max-width: 1400px;
    margin: auto;
    padding: 0 20px 50px;
}

.section-title {
    margin: 25px 0 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.section-title h2 {
    font-size: 25px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 18px;
}

.game-card {
    background: var(--panel);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform .22s, box-shadow .22s;
    box-shadow: 0 7px 25px rgba(0,0,0,.15);
}

.game-card:hover {
    transform: translateY(-7px) scale(1.015);
    box-shadow: var(--shadow);
}

.game-image {
    height: 145px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
}

.game-card:nth-child(2n) .game-image {
    background: linear-gradient(135deg, #ff7675, #fdcb6e);
}

.game-card:nth-child(3n) .game-image {
    background: linear-gradient(135deg, #0984e3, #74b9ff);
}

.game-card:nth-child(4n) .game-image {
    background: linear-gradient(135deg, #00b894, #55efc4);
}

.game-info {
    padding: 14px;
}

.game-info h3 {
    font-size: 17px;
}

.game-info p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 5px;
}

.favorite {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,.4);
    color: white;
    cursor: pointer;
    font-size: 17px;
}

/* GAME SCREEN */

.game-screen {
    position: fixed;
    inset: 0;
    background: rgba(4,5,8,.96);
    z-index: 500;
    display: none;
    flex-direction: column;
}

.game-screen.active {
    display: flex;
}

.game-top {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #11141d;
}

.game-top h2 {
    font-size: 20px;
}

.game-actions {
    display: flex;
    gap: 8px;
}

.game-actions button {
    border: none;
    background: #252b3a;
    color: white;
    border-radius: 10px;
    padding: 10px 15px;
    cursor: pointer;
}

.game-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

canvas {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 15px;
    background: #111;
    box-shadow: 0 15px 60px rgba(0,0,0,.5);
}

/* CALCULATOR */

.calc-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 400;
}

.calc-overlay.active {
    display: flex;
}

.calculator {
    width: min(380px, 92vw);
    background: var(--panel);
    padding: 20px;
    border-radius: 25px;
    box-shadow: var(--shadow);
}

.calc-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.calc-display {
    width: 100%;
    height: 75px;
    border: none;
    border-radius: 15px;
    background: var(--panel2);
    color: var(--text);
    text-align: right;
    padding: 10px 15px;
    font-size: 30px;
    margin-bottom: 12px;
}

.calc-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

.calc-buttons button {
    height: 60px;
    border: none;
    border-radius: 13px;
    cursor: pointer;
    background: var(--panel2);
    color: var(--text);
    font-size: 19px;
    transition: .15s;
}

.calc-buttons button:hover {
    transform: scale(1.03);
}

.calc-buttons .operator {
    background: var(--accent);
    color: white;
}

.calc-buttons .equals {
    background: var(--accent2);
    color: #071414;
}

/* MODAL */

.message {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--panel);
    padding: 14px 20px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    z-index: 1000;
    transition: .3s;
}

.message.show {
    transform: translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:700px) {
    .nav {
        gap: 10px;
    }

    .logo {
        font-size: 20px;
    }

    .nav-buttons {
        display: none;
    }

    .hero-box {
        padding: 30px;
    }

    .game-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .game-image {
        height: 110px;
        font-size: 45px;
    }
}
</style>
</head>

<body>

<header>
    <div class="nav">
        <div class="logo">GAME<span>ZONE</span></div>

        <div class="search">
            <span class="search-icon">🔎</span>
            <input id="searchInput" type="text" placeholder="Zoek een game...">
        </div>

        <div class="nav-buttons">
            <button class="icon-btn" onclick="openCalculator()" title="Rekenmachine">🧮</button>
            <button class="icon-btn" onclick="toggleTheme()" title="Thema">🌙</button>
        </div>
    </div>
</header>

<section class="hero">
    <div class="hero-box">
        <h1>Speel. Win. Herhaal. 🎮</h1>
        <p>Ontdek een hele collectie gratis browsergames.</p>
        <button onclick="scrollToGames()">Bekijk games ↓</button>
    </div>
</section>

<div class="categories">
    <button class="category active" data-category="all">🔥 Alles</button>
    <button class="category" data-category="arcade">🕹️ Arcade</button>
    <button class="category" data-category="action">⚡ Actie</button>
    <button class="category" data-category="puzzle">🧩 Puzzel</button>
    <button class="category" data-category="racing">🏎️ Racing</button>
    <button class="category" data-category="classic">👾 Klassiekers</button>
</div>

<main class="container" id="gamesSection">

    <div class="section-title">
        <h2>🔥 Populaire games</h2>
        <span id="gameCount"></span>
    </div>

    <div class="game-grid" id="gameGrid"></div>

</main>

<!-- GAME SCREEN -->

<div class="game-screen" id="gameScreen">

    <div class="game-top">
        <h2 id="gameTitle">Game</h2>

        <div class="game-actions">
            <button onclick="restartCurrentGame()">↻ Opnieuw</button>
            <button onclick="closeGame()">✕ Sluiten</button>
        </div>
    </div>

    <div class="game-area">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
    </div>

</div>

<!-- CALCULATOR -->

<div class="calc-overlay" id="calcOverlay">

    <div class="calculator">

        <div class="calc-head">
            <h2>🧮 Rekenmachine</h2>
            <button class="icon-btn" onclick="closeCalculator()">✕</button>
        </div>

        <input class="calc-display" id="calcDisplay" value="0" readonly>

        <div class="calc-buttons">

            <button onclick="calcClear()">AC</button>
            <button onclick="calcDelete()">⌫</button>
            <button onclick="calcInput('%')">%</button>
            <button class="operator" onclick="calcInput('/')">÷</button>

            <button onclick="calcInput('7')">7</button>
            <button onclick="calcInput('8')">8</button>
            <button onclick="calcInput('9')">9</button>
            <button class="operator" onclick="calcInput('*')">×</button>

            <button onclick="calcInput('4')">4</button>
            <button onclick="calcInput('5')">5</button>
            <button onclick="calcInput('6')">6</button>
            <button class="operator" onclick="calcInput('-')">−</button>

            <button onclick="calcInput('1')">1</button>
            <button onclick="calcInput('2')">2</button>
            <button onclick="calcInput('3')">3</button>
            <button class="operator" onclick="calcInput('+')">+</button>

            <button onclick="calcInput('0')" style="grid-column:span 2">0</button>
            <button onclick="calcInput('.')">.</button>
            <button class="equals" onclick="calcEquals()">=</button>

        </div>

    </div>
</div>

<div class="message" id="message"></div>

<script>

/* =========================
   GAME DATABASE
========================= */

const games = [

{
    id:"snake",
    title:"Snake",
    description:"Eet appels en word steeds langer.",
    emoji:"🐍",
    category:"classic"
},

{
    id:"flappy",
    title:"Flappy Bird",
    description:"Vlieg door de buizen.",
    emoji:"🐦",
    category:"arcade"
},

{
    id:"dodge",
    title:"Dodge",
    description:"Ontwijk alle blokken.",
    emoji:"💥",
    category:"action"
},

{
    id:"space",
    title:"Space Shooter",
    description:"Schiet vijanden uit de lucht.",
    emoji:"🚀",
    category:"action"
},

{
    id:"breakout",
    title:"Brick Breaker",
    description:"Breek alle blokken.",
    emoji:"🧱",
    category:"arcade"
},

{
    id:"runner",
    title:"Neon Runner",
    description:"Spring over obstakels.",
    emoji:"🏃",
    category:"arcade"
},

{
    id:"pong",
    title:"Pong",
    description:"Versla de computer.",
    emoji:"🏓",
    category:"classic"
},

{
    id:"memory",
    title:"Memory",
    description:"Vind alle gelijke paren.",
    emoji:"🧠",
    category:"puzzle"
},

{
    id:"reaction",
    title:"Reaction Test",
    description:"Hoe snel kun jij reageren?",
    emoji:"⚡",
    category:"puzzle"
},

{
    id:"clicker",
    title:"Mega Clicker",
    description:"Klik zo snel mogelijk.",
    emoji:"👆",
    category:"arcade"
},

{
    id:"racer",
    title:"Traffic Racer",
    description:"Ontwijk het verkeer.",
    emoji:"🏎️",
    category:"racing"
},

{
    id:"target",
    title:"Target Shooter",
    description:"Raak zoveel mogelijk targets.",
    emoji:"🎯",
    category:"action"
}

];

let currentCategory = "all";
let currentGame = null;
let animationFrame = null;

/* =========================
   RENDER GAMES
========================= */

function renderGames() {

    const grid = document.getElementById("gameGrid");
    const search = document.getElementById("searchInput").value.toLowerCase();

    grid.innerHTML = "";

    let filtered = games.filter(game => {

        const categoryMatch =
            currentCategory === "all" ||
            game.category === currentCategory;

        const searchMatch =
            game.title.toLowerCase().includes(search) ||
            game.description.toLowerCase().includes(search);

        return categoryMatch && searchMatch;
    });

    document.getElementById("gameCount").textContent =
        filtered.length + " games";

    filtered.forEach(game => {

        const card = document.createElement("div");
        card.className = "game-card";

        const favorite = localStorage.getItem("fav_" + game.id) === "true";

        card.innerHTML = `
            <button class="favorite"
                onclick="event.stopPropagation();toggleFavorite('${game.id}')">
                ${favorite ? "❤️" : "♡"}
            </button>

            <div class="game-image">${game.emoji}</div>

            <div class="game-info">
                <h3>${game.title}</h3>
                <p>${game.description}</p>
            </div>
        `;

        card.onclick = () => openGame(game.id);

        grid.appendChild(card);
    });
}

document.getElementById("searchInput").addEventListener("input", renderGames);

document.querySelectorAll(".category").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".category")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        currentCategory = button.dataset.category;

        renderGames();
    });

});

function toggleFavorite(id) {

    const key = "fav_" + id;
    const current = localStorage.getItem(key) === "true";

    localStorage.setItem(key, !current);

    renderGames();
}

/* =========================
   GAME ENGINE
========================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function openGame(id) {

    currentGame = id;

    const game = games.find(g => g.id === id);

    document.getElementById("gameTitle").textContent = game.title;
    document.getElementById("gameScreen").classList.add("active");

    cancelAnimationFrame(animationFrame);

    canvas.width = 900;
    canvas.height = 600;

    if (id === "snake") startSnake();
    if (id === "flappy") startFlappy();
    if (id === "dodge") startDodge();
    if (id === "space") startSpace();
    if (id === "breakout") startBreakout();
    if (id === "runner") startRunner();
    if (id === "pong") startPong();
    if (id === "memory") startMemory();
    if (id === "reaction") startReaction();
    if (id === "clicker") startClicker();
    if (id === "racer") startRacer();
    if (id === "target") startTarget();
}

function closeGame() {

    cancelAnimationFrame(animationFrame);

    document.getElementById("gameScreen").classList.remove("active");
}

function restartCurrentGame() {

    if(currentGame) openGame(currentGame);
}

function resizeGame() {

    const maxWidth = window.innerWidth - 30;
    const maxHeight = window.innerHeight - 100;

    const ratio = 900 / 600;

    let width = Math.min(900, maxWidth);
    let height = width / ratio;

    if(height > maxHeight) {
        height = maxHeight;
        width = height * ratio;
    }

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
}

window.addEventListener("resize", resizeGame);

/* =========================
   SNAKE
========================= */

function startSnake() {

    let snake = [{x:10,y:10}];
    let food = {x:15,y:10};

    let dx = 1;
    let dy = 0;
    let score = 0;

    const grid = 30;
    const cell = 20;

    function foodPos() {
        food = {
            x:Math.floor(Math.random()*grid),
            y:Math.floor(Math.random()*grid)
        };
    }

    function key(e) {

        if(e.key==="ArrowUp" && dy===0) {
            dx=0; dy=-1;
        }

        if(e.key==="ArrowDown" && dy===0) {
            dx=0; dy=1;
        }

        if(e.key==="ArrowLeft" && dx===0) {
            dx=-1; dy=0;
        }

        if(e.key==="ArrowRight" && dx===0) {
            dx=1; dy=0;
        }
    }

    document.onkeydown = key;

    let last = 0;

    function loop(time) {

        if(time-last > 100) {

            last = time;

            const head = {
                x:snake[0].x+dx,
                y:snake[0].y+dy
            };

            if(
                head.x<0 ||
                head.y<0 ||
                head.x>=grid ||
                head.y>=grid ||
                snake.some(s=>s.x===head.x && s.y===head.y)
            ) {
                alert("Game over! Score: " + score);
                return;
            }

            snake.unshift(head);

            if(head.x===food.x && head.y===food.y) {
                score++;
                foodPos();
            } else {
                snake.pop();
            }
        }

        ctx.fillStyle="#10131c";
        ctx.fillRect(0,0,900,600);

        ctx.fillStyle="#ff4757";
        ctx.fillRect(food.x*cell,food.y*cell,cell-2,cell-2);

        ctx.fillStyle="#00cec9";

        snake.forEach((s,i)=>{
            ctx.fillRect(s.x*cell,s.y*cell,cell-2,cell-2);
        });

        ctx.fillStyle="white";
        ctx.font="22px Arial";
        ctx.fillText("Score: "+score,20,30);

        animationFrame=requestAnimationFrame(loop);
    }

    animationFrame=requestAnimationFrame(loop);
}

/* =========================
   FLAPPY
========================= */

function startFlappy() {

    let bird = {x:180,y:300,vy:0};
    let pipes=[];
    let score=0;
    let frame=0;
    let gameOver=false;

    document.onkeydown = e => {
        if(e.code==="Space") {
            bird.vy=-7;
        }
    };

    canvas.onclick=()=>{
        bird.vy=-7;
    };

    function loop() {

        if(gameOver) return;

        frame++;

        bird.vy += .35;
        bird.y += bird.vy;

        if(frame%100===0) {

            const gap=170;
            const top=80+Math.random()*280;

            pipes.push({
                x:900,
                top,
                bottom:top+gap,
                passed:false
            });
        }

        pipes.forEach(p=>p.x-=4);

        pipes=pipes.filter(p=>p.x>-80);

        pipes.forEach(p=>{

            if(
                bird.x+25>p.x &&
                bird.x-25<p.x+70 &&
                (bird.y-20<p.top || bird.y+20>p.bottom)
            ) {
                gameOver=true;
            }

            if(!p.passed && p.x<bird.x) {
                p.passed=true;
                score++;
            }
        });

        if(bird.y<0 || bird.y>600)
            gameOver=true;

        ctx.fillStyle="#74b9ff";
        ctx.fillRect(0,0,900,600);

        ctx.fillStyle="#55efc4";

        pipes.forEach(p=>{
            ctx.fillRect(p.x,0,70,p.top);
            ctx.fillRect(p.x,p.bottom,70,600-p.bottom);
        });

        ctx.fillStyle="#fdcb6e";
        ctx.beginPath();
        ctx.arc(bird.x,bird.y,22,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";
        ctx.font="28px Arial";
        ctx.fillText("Score: "+score,20,40);

        if(gameOver) {

            ctx.fillStyle="rgba(0,0,0,.65)";
            ctx.fillRect(0,0,900,600);

            ctx.fillStyle="white";
            ctx.textAlign="center";
            ctx.font="50px Arial";
            ctx.fillText("GAME OVER",450,280);

            ctx.font="25px Arial";
            ctx.fillText("Score: "+score,450,330);

            ctx.textAlign="left";
            return;
        }

        animationFrame=requestAnimationFrame(loop);
    }

    animationFrame=requestAnimationFrame(loop);
}

/* =========================
   DODGE
========================= */

function startDodge() {

    let player={x:430,y:520,w:40,h:40};
    let blocks=[];
    let score=0;
    let keys={};

function startSpace() {

    let enemies=[];

        keys[e.key]=true;

                x:player.x+18,
                y:player.y,
                speed:8
            });

        if(keys.ArrowRight) player.x+=6;

        player.x=Math.max(0,Math.min(860,player.x));

        bullets.forEach(b=>b.y-=b.speed);

            enemies.push({

                y:-30,
                size:30,
                speed:2+Math.random()*2
            });
        }

        enemies.forEach(e=>e.y+=e.speed);

        bullets.forEach(b=>{

            enemies.forEach(e=>{

                if(
                    b.x>e.x &&
                    b.x<e.x+e.size &&
                    b.y>e.y &&
                    b.y<e.y+e.size

                    e.dead=true;
                    b.dead=true;
                    score++;

        enemies=enemies.filter(e=>!e.dead && e.y<620);

        ctx.fillRect(0,0,900,600);

        for(let i=0;i<50;i++){

/* =========================
   BREAKOUT
========================= */

function startBreakout() {

    let paddle={x:370,y:550,w:160,h:15};
    let ball={x:450,y:500,dx:5,dy:-5,r:10};

    let bricks=[];

    for(let r=0;r<5;r++) {
        for(let c=0;c<10;c++) {

            bricks.push({
                x:35+c*84,
                y:60+r*30,
                w:70,
                h:20,
                alive:true
            });
        }
    }

    document.onmousemove=e=>{

        const rect=canvas.getBoundingClientRect();

        paddle.x=
            (e.clientX-rect.left)*
            (canvas.width/rect.width)-paddle.w/2;
    };

    function loop() {

        ball.x+=ball.dx;
        ball.y+=ball.dy;

        if(ball.x<ball.r || ball.x>900-ball.r)
            ball.dx*=-1;

        if(ball.y<ball.r)
            ball.dy*=-1;

        if(
            ball.y+ball.r>paddle.y &&
            ball.x>paddle.x &&
            ball.x<paddle.x+paddle.w
        ) {
            ball.dy=-Math.abs(ball.dy);
        }

        bricks.forEach(b=>{

            if(
                b.alive &&
                ball.x>b.x &&
                ball.x<b.x+b.w &&
                ball.y>b.y &&
                ball.y<b.y+b.h
            ) {

                b.alive=false;
                ball.dy*=-1;
            }
        });

        if(ball.y>620) {

            alert("Game over!");
            return;
        }

        ctx.fillStyle="#10131c";
        ctx.fillRect(0,0,900,600);

        bricks.forEach(b=>{

            if(b.alive) {

                ctx.fillStyle="#6c5ce7";
                ctx.fillRect(b.x,b.y,b.w,b.h);
            }
        });

        ctx.fillStyle="#00cec9";
        ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);

        ctx.fillStyle="#fff";
        ctx.beginPath();
        ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
        ctx.fill();

        animationFrame=requestAnimationFrame(loop);
    }

    animationFrame=requestAnimationFrame(loop);
}

/* =========================
   NEON RUNNER
========================= */

function startRunner() {

    let player={x:120,y:500,w:40,h:60,vy:0};
    let obstacles=[];
    let score=0;
    let keys={};
    let grounded=true;

    document.onkeydown=e=>{

        keys[e.key]=true;

        if(
            (e.code==="Space" || e.key==="ArrowUp") &&
            grounded
        ) {
            player.vy=-12;
            grounded=false;
        }
    };

    function loop() {

        player.vy+=.5;
        player.y+=player.vy;

        if(player.y>=500) {

            player.y=500;
            player.vy=0;
            grounded=true;
        }

        if(Math.random()<.025) {

            obstacles.push({
                x:900,
                y:520,
                w:30+Math.random()*30,
                h:40+Math.random()*30
            });
        }

        obstacles.forEach(o=>o.x-=7);

        obstacles=obstacles.filter(o=>o.x>-100);

        for(const o of obstacles) {

            if(
                player.x<o.x+o.w &&
                player.x+player.w>o.x &&
                player.y<o.y &&
                player.y+player.h>o.y-o.h
            ) {

                alert("Game over! Score: "+Math.floor(score));
                return;
            }
        }

        score+=.05;

        ctx.fillStyle="#090b18";
        ctx.fillRect(0,0,900,600);

        ctx.strokeStyle="#6c5ce7";

        for(let x=0;x<900;x+=50) {
            ctx.beginPath();
            ctx.moveTo(x,0);
            ctx.lineTo(x,600);
            ctx.stroke();
        }

        ctx.fillStyle="#00cec9";
        ctx.fillRect(player.x,player.y,player.w,player.h);

        ctx.fillStyle="#ff4757";

        obstacles.forEach(o=>{
            ctx.fillRect(o.x,o.y-o.h,o.w,o.h);
        });

        ctx.fillStyle="white";
        ctx.font="22px Arial";
        ctx.fillText("Score: "+Math.floor(score),20,35);

        animationFrame=requestAnimationFrame(loop);
    }

    animationFrame=requestAnimationFrame(loop);
}

/* =========================

========================= */

function startPong() {

    let playerY=250;
    let aiY=250;

    let ball={
        x:450,
        y:300,
        dx:6,
        dy:4
    };

    let score=0;

    document.onmousemove=e=>{

        const rect=canvas.getBoundingClientRect();

        playerY=
            (e.clientY-rect.top)*
            (canvas.height/rect.height)-50;
    };

    function loop() {

        ball.x+=ball.dx;
        ball.y+=ball.dy;

        if(ball.y<0 || ball.y>600)
            ball.dy*=-1;

        aiY+=(ball.y-aiY-50)*.06;

        if(
            ball.x<50 &&
            ball.y>playerY &&
            ball.y<playerY+100
        ) {
            ball.dx=Math.abs(ball.dx);
            score++;
        }

        if(
            ball.x>850 &&
            ball.y>aiY &&
            ball.y<aiY+100
        ) {
            ball.dx=-Math.abs(ball.dx);
        }

        if(ball.x<0 || ball.x>900) {

            ball={
                x:450,
                y:300,
                dx:ball.x<0?6:-6,
                dy:4
            };
        }

        ctx.fillStyle="#10131c";
        ctx.fillRect(0,0,900,600);

        ctx.fillStyle="white";
        ctx.fillRect(25,playerY,20,100);
        ctx.fillRect(855,aiY,20,100);

        ctx.beginPath();
        ctx.arc(ball.x,ball.y,10,0,Math.PI*2);
        ctx.fill();

        ctx.font="25px Arial";
        ctx.fillText(score,440,45);

        animationFrame=requestAnimationFrame(loop);
    }

    animationFrame=requestAnimationFrame(loop);
}

/* =========================
   MEMORY
========================= */

function startMemory() {

    cancelAnimationFrame(animationFrame);

    const symbols=["🍎","🍎","🚀","🚀","🐸","🐸","⚽","⚽","🔥","🔥","👾","👾"];
    symbols.sort(()=>Math.random()-.5);

    let flipped=[];
    let matched=[];

    ctx.fillStyle="#10131c";
    ctx.fillRect(0,0,900,600);

    function draw() {

        ctx.fillStyle="#10131c";
        ctx.fillRect(0,0,900,600);

        symbols.forEach((s,i)=>{

            const x=170+(i%4)*145;
            const y=100+Math.floor(i/4)*145;

            ctx.fillStyle=
                matched.includes(i) || flipped.includes(i)
                ? "#6c5ce7"
                : "#252b3a";

            ctx.fillRect(x,y,110,110);

            if(matched.includes(i) || flipped.includes(i)) {

                ctx.font="50px Arial";
                ctx.textAlign="center";
                ctx.fillStyle="white";
                ctx.fillText(s,x+55,y+70);
                ctx.textAlign="left";
            }
        });
    }

    canvas.onclick=e=>{

        const rect=canvas.getBoundingClientRect();

        const mx=(e.clientX-rect.left)*(900/rect.width);
        const my=(e.clientY-rect.top)*(600/rect.height);

        const col=Math.floor((mx-170)/145);
        const row=Math.floor((my-100)/145);

        if(col<0 || col>3 || row<0 || row>2)
            return;

        const index=row*4+col;

        if(
            flipped.includes(index) ||
            matched.includes(index)
        ) return;

        flipped.push(index);

        if(flipped.length===2) {

            if(symbols[flipped[0]]===symbols[flipped[1]]) {

                matched.push(...flipped);
                flipped=[];
            } else {

                const old=[...flipped];

                setTimeout(()=>{
                    flipped=[];
                    draw();
                },600);
            }
        }

        draw();

        if(matched.length===symbols.length) {

            setTimeout(()=>{
                alert("Je hebt gewonnen!");
            },300);
        }
    };

    draw();
}

/* =========================
   TARGET SHOOTER
========================= */

function startTarget() {

    let targets=[];
    let score=0;
    let time=30;

    canvas.onclick=e=>{

        const rect=canvas.getBoundingClientRect();

        const x=(e.clientX-rect.left)*(900/rect.width);
        const y=(e.clientY-rect.top)*(600/rect.height);

        targets.forEach(t=>{

            const d=Math.hypot(x-t.x,y-t.y);

            if(d<t.r) {

                t.dead=true;
                score++;
            }
        });
    };

    const timer=setInterval(()=>{

        time--;

        if(time<=0) {

            clearInterval(timer);
            alert("Tijd voorbij! Score: "+score);
        }

    },1000);

    function loop() {

        if(Math.random()<.025) {

            targets.push({
                x:50+Math.random()*800,
                y:70+Math.random()*480,
                r:20+Math.random()*25,
                dead:false
            });
        }

        targets=targets.filter(t=>!t.dead);

        ctx.fillStyle="#10131c";
        ctx.fillRect(0,0,900,600);

        targets.forEach(t=>{

            ctx.fillStyle="#ff4757";
            ctx.beginPath();
            ctx.arc(t.x,t.y,t.r,0,Math.PI*2);
            ctx.fill();

            ctx.fillStyle="white";
            ctx.beginPath();
            ctx.arc(t.x,t.y,t.r*.55,0,Math.PI*2);
            ctx.fill();
        });

        ctx.fillStyle="white";
        ctx.font="22px Arial";
        ctx.fillText("Score: "+score,20,35);
        ctx.fillText("Tijd: "+time,780,35);

        animationFrame=requestAnimationFrame(loop);
    }

    animationFrame=requestAnimationFrame(loop);
}

/* =========================
   CALCULATOR
========================= */

let calcValue="0";

function updateCalc() {

    document.getElementById("calcDisplay").value=calcValue;
}

function calcInput(value) {

    if(calcValue==="0" && value!==".")
        calcValue=value;
    else
        calcValue+=value;

    updateCalc();
}

function calcClear() {

    calcValue="0";
    updateCalc();
}

function calcDelete() {

    calcValue=calcValue.slice(0,-1);

    if(calcValue==="")
        calcValue="0";

    updateCalc();
}

function calcEquals() {

    try {

        let expression=calcValue.replace(/%/g,"/100");

        if(!/^[0-9+\-*/(). ]+$/.test(expression))
            throw new Error();

        calcValue=String(Function(
            '"use strict"; return ('+expression+')'
        )());

        updateCalc();

    } catch {

        calcValue="Error";
        updateCalc();

        setTimeout(()=>{
            calcValue="0";
            updateCalc();
        },1000);
    }
}

function openCalculator() {

    document.getElementById("calcOverlay")
        .classList.add("active");
}

function closeCalculator() {

    document.getElementById("calcOverlay")
        .classList.remove("active");
}
