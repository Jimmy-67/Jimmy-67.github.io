    <!-- SNAKE GAME BLOK -->
<div id="snakeGame" style="
    width: 360px;
    max-width: 100%;
    margin: 30px auto;
    padding: 20px;
    background: #111;
    border: 3px solid #333;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: center;
    font-family: Arial, sans-serif;
    color: white;
">
    <h2 style="margin: 0 0 10px;">🐍 Snake</h2>

    <div style="margin-bottom: 12px; font-size: 18px;">
        Score: <span id="snakeScore">0</span>
    </div>

    <canvas id="snakeCanvas"
        width="320"
        height="320"
        style="
            width: 320px;
            max-width: 100%;
            background: #050505;
            border: 2px solid #444;
            border-radius: 10px;
            display: block;
            margin: auto;
        ">
    </canvas>

    <p style="font-size: 14px; color: #aaa; margin: 12px 0;">
        Gebruik de pijltjestoetsen om te bewegen
    </p>

    <button onclick="startSnake()" style="
        padding: 10px 22px;
        border: none;
        border-radius: 10px;
        background: #27ae60;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    ">
        Start / Opnieuw
    </button>
</div>

<script>
(function () {
    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("snakeScore");

    const grid = 16;
    const tile = canvas.width / grid;

    let snake;
    let food;
    let dx;
    let dy;
    let nextDx;
    let nextDy;
    let score;
    let gameRunning = false;
    let gameOver = false;
    let gameLoop;

    function createFood() {
        let newFood;

        do {
            newFood = {
                x: Math.floor(Math.random() * grid),
                y: Math.floor(Math.random() * grid)
            };
        } while (
            snake.some(part =>
                part.x === newFood.x && part.y === newFood.y
            )
        );

        return newFood;
    }

    function drawGame() {
        // Achtergrond
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtiel raster
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 1;

        for (let i = 0; i <= grid; i++) {
            ctx.beginPath();
            ctx.moveTo(i * tile, 0);
            ctx.lineTo(i * tile, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i * tile);
            ctx.lineTo(canvas.width, i * tile);
            ctx.stroke();
        }

        // Voedsel
        ctx.fillStyle = "#ff4757";
        ctx.beginPath();
        ctx.arc(
            food.x * tile + tile / 2,
            food.y * tile + tile / 2,
            tile * 0.35,
            0,
            Math.PI * 2
        );
        ctx.fill();

        // Slang
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? "#2ed573" : "#20bf6b";

            ctx.fillRect(
                part.x * tile + 1,
                part.y * tile + 1,
                tile - 2,
                tile - 2
            );
        });

        // Game over scherm
        if (gameOver) {
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.font = "bold 32px Arial";
            ctx.fillText(
                "GAME OVER",
                canvas.width / 2,
                canvas.height / 2 - 10
            );

            ctx.font = "18px Arial";
            ctx.fillText(
                "Klik op Opnieuw",
                canvas.width / 2,
                canvas.height / 2 + 25
            );
        }
    }

    function updateGame() {
        if (!gameRunning) return;

        dx = nextDx;
        dy = nextDy;

        const head = {
            x: snake[0].x + dx,
            y: snake[0].y + dy
        };

        // Botsing met muur
        if (
            head.x < 0 ||
            head.x >= grid ||
            head.y < 0 ||
            head.y >= grid
        ) {
            endGame();
            return;
        }

        // Botsing met zichzelf
        if (
            snake.some(part =>
                part.x === head.x && part.y === head.y
            )
        ) {
            endGame();
            return;
        }

        snake.unshift(head);

        // Voedsel gegeten
        if (
            head.x === food.x &&
            head.y === food.y
        ) {
            score++;
            scoreText.textContent = score;
            food = createFood();
        } else {
            snake.pop();
        }

        drawGame();
    }

    function endGame() {
        gameRunning = false;
        gameOver = true;
        clearInterval(gameLoop);
        drawGame();
    }

    window.startSnake = function () {
        clearInterval(gameLoop);

        snake = [
            { x: 8, y: 8 },
            { x: 7, y: 8 },
            { x: 6, y: 8 }
        ];

        dx = 1;
        dy = 0;
        nextDx = 1;
        nextDy = 0;

        score = 0;
        scoreText.textContent = score;

        gameOver = false;
        gameRunning = true;

        food = createFood();

        drawGame();

        gameLoop = setInterval(updateGame, 120);
    };

    document.addEventListener("keydown", function (event) {
        if (!gameRunning) return;

        if (event.key === "ArrowUp" && dy !== 1) {
            nextDx = 0;
            nextDy = -1;
        }

        if (event.key === "ArrowDown" && dy !== -1) {
            nextDx = 0;
            nextDy = 1;
        }

        if (event.key === "ArrowLeft" && dx !== 1) {
            nextDx = -1;
            nextDy = 0;
        }

        if (event.key === "ArrowRight" && dx !== -1) {
            nextDx = 1;
            nextDy = 0;
        }

        event.preventDefault();
    });

    // Teken eerste scherm
    snake = [
        { x: 8, y: 8 },
        { x: 7, y: 8 },
        { x: 6, y: 8 }
    ];

    food = { x: 12, y: 8 };
    drawGame();
})();
</script>
</html>
